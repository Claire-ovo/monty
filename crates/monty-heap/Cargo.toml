[package]
name = "monty-heap"
version = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
description = "Reference-counted, cycle-collected paged arena shared by Monty's sandbox interpreters"
keywords = ["heap", "arena", "refcount", "sandbox"]
categories = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"

[dependencies]
monty-types = { workspace = true }
serde = { workspace = true }
smallvec = { version = "1.13", features = ["serde"] }

[dev-dependencies]
minicbor-serde = { workspace = true }

[features]
# Exposes per-entry reference counts, live-entry counts and leak detection to
# the interpreters' reference-counting tests.
ref-count-return = ["test-hooks"]
# Collects on every GC-tracked allocation and tears the heap down on drop, so a
# payload type's own debug bookkeeping (`Value::Dereferenced` in `monty`) can
# catch leaked references.
memory-model-checks = []
# `disable_gc` / `enable_gc`, for tests that time a single collection.
test-hooks = []

[lints]
workspace = true
