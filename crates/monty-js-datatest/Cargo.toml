[package]
name = "monty-js-datatest"
version = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
description = "Datatest harness for Monty's JavaScript engine — runs test cases against both monty-ecma and Node"
publish = false

[dependencies]
monty-ecma = { workspace = true }
monty-fixture = { path = "../monty-fixture" }
monty-types = { workspace = true }
datatest-stable = "0.2"
similar = "2.7.0"
oxc_transformer = { workspace = true }
oxc_codegen = { workspace = true }
oxc_allocator = { workspace = true }
oxc_parser = { workspace = true }
oxc_semantic = { workspace = true }
oxc_span = { workspace = true }

[features]
# Fail a case whose feed leaves heap entries no root reaches (a missed release).
ref-count-return = ["monty-ecma/ref-count-return"]

[lints]
workspace = true
